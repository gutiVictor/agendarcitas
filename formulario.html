  <meta name="description" content="Agenda tu cita médica en las comunas 1 y 2 de Armenia. Sistema rápido y fácil para gestionar tus turnos.">
  <title>Agendar Cita - SaludComuna Armenia</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="landing.css" />
  <link rel="stylesheet" href="forms.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- HEADER -->
  <header class="main-header">
    <div class="container">
      <a href="index.html" class="logo-section">
        <img src="https://aldesarrollo.gov.co/wp-content/uploads/2023/03/alcaldia-armenia-768x400.png.webp" alt="Alcaldía de Armenia" class="logo">

          <span class="brand-name">Salud<span class="highlight">Comuna</span></span>
          <span class="brand-sub">Armenia - Comunas 1 y 2</span>
        </div>
      </a>
      <nav class="main-nav">
        <a href="index.html">Inicio</a>
        <a href="#" class="active-link">Agendar Cita</a>
      </nav>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <div class="container">
      <a href="index.html">Inicio</a> / <span>Agendar cita médica</span>
    </div>
  </div>

  <!-- FORM SECTION -->
  <main class="form-section">
    <div class="container">
      <div class="form-wrapper">
        <div class="form-header">
          <h1>📅 Agendar Nueva Cita</h1>
          <p>Complete el formulario para reservar su cita médica</p>
        </div>

        <form id="formCita">
          <div class="form-grid">
            <div class="form-group full-width">
              <label>
                <span>👤 Nombre completo</span>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required />
              </label>
            </div>

            <div class="form-group">
              <label>
                <span>🪪 Cédula</span>
                <input type="text" id="cedula" name="cedula" placeholder="Ej: 1234567890" pattern="\d{6,10}" required />
              </label>
            </div>

            <div class="form-group">
              <label>
                <span>🎂 Edad</span>
                <input type="number" id="edad" name="edad" placeholder="Años" min="1" max="120" required />
              </label>
            </div>

            <div class="form-group full-width">
              <label>
                <span>📞 Teléfono</span>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required />
              </label>
            </div>

            <div class="form-group full-width">
              <label>
                <span>🏠 Dirección</span>
                <input type="text" id="direccion" name="direccion" placeholder="Ingrese su dirección completa" required />
              </label>
            </div>

            <div class="form-group full-width">
              <label>
                <span>📍 Comuna</span>
                <select id="comuna" name="comuna" required>
                  <option value="">Seleccione su comuna...</option>
                  <option value="1">Comuna 1</option>
                  <option value="2">Comuna 2</option>
                </select>
              </label>
            </div>

            <div class="form-group">
              <label>
                <span>📅 Fecha</span>
                <input type="date" id="fecha" name="fecha" required />
              </label>
            </div>

            <div class="form-group">
              <label>
                <span>🕐 Hora</span>
                <select id="hora" name="hora" required>
                  <option value="">Seleccione hora...</option>
                </select>
              </label>
            </div>

            <div class="form-group full-width">
              <button type="submit" class="btn-submit">
                ✅ Confirmar Cita
              </button>
            </div>
          </div>
        </form>

        <div id="mensaje"></div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="main-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <img src="https://aldesarrollo.gov.co/wp-content/uploads/2023/03/alcaldia-armenia-768x400.png.webp" alt="Alcaldía de Armenia" class="footer-logo">
          <span>SaludComuna Armenia</span>
        </div>
        <div class="footer-info">
          <p>© 2025 Alcaldía de Armenia - Comunas 1 y 2</p>
          <p>Línea de atención: 018000-123456</p>
        </div>
      </div>
    </div>
  </footer>
